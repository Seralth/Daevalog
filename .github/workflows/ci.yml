name: CI

on:
  push:
    branches: [daevalog]
  pull_request:
  # By hand, for a branch: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

# Every job only reads the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Windows is a second-class platform: built and tested here on every push,
  # checked by hand only at major releases, fixed when someone reports a break.
  desktop:
    name: Windows build, tests and start-up
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Front end
        run: |
          npm ci
          npm run build
          node --test tests/
      - name: Check
        working-directory: src-tauri
        run: cargo check --workspace --all-targets --all-features
      - name: Test
        working-directory: src-tauri
        # The replay tests skip without A2_REPLAY_CAPTURE, which is a real packet
        # capture and not something to commit — it is a recording of five real
        # people playing. They run locally; everything else runs here.
        run: cargo test --all-targets
      # The capture crate: libpcap, which Windows captures with too, and the
      # Linux helper's pipe. The helper binary itself is Linux only.
      - name: Test capture crate
        working-directory: src-tauri
        run: cargo test -p daevalog-capture --lib
      # As the packages build it: a plain cargo build would load the page from
      # the development server instead of the built-in files.
      - name: Build the meter
        run: npx tauri build --no-bundle
      # Start the release build as a player would, without Npcap (the runner has
      # none): the window has to open, the log has to say capture is off, the
      # page has to load and show its Npcap notice (a confirm() dialog, found
      # through UI Automation and cancelled), and the meter has to quit cleanly
      # when its window is closed.
      #
      # The data folder is %APPDATA%\com.daevalog.dps-meter (Tauri asks Windows
      # for the Roaming folder, so the APPDATA variable cannot move it). A fresh
      # runner has none, so this is a first start.
      - name: Start-up
        shell: pwsh
        run: |
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          Add-Type @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class Wins {
            delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint msg, IntPtr w, IntPtr l);
            public class Win { public IntPtr Handle; public uint Pid; public string Class; public string Title; }
            public static List<Win> Visible() {
              var list = new List<Win>();
              EnumWindows((h, l) => {
                if (IsWindowVisible(h)) {
                  uint pid; GetWindowThreadProcessId(h, out pid);
                  var t = new StringBuilder(256); GetWindowText(h, t, 256);
                  var c = new StringBuilder(256); GetClassName(h, c, 256);
                  list.Add(new Win { Handle = h, Pid = pid, Class = c.ToString(), Title = t.ToString() });
                }
                return true;
              }, IntPtr.Zero);
              return list;
            }
          }
          '@
          $Tree = [System.Windows.Automation.TreeScope]::Descendants
          $Any = [System.Windows.Automation.Condition]::TrueCondition

          $data = Join-Path ([Environment]::GetFolderPath('ApplicationData')) 'com.daevalog.dps-meter'
          if (Test-Path $data) { throw "The data folder exists before the first start: $data" }
          $out = Join-Path $env:RUNNER_TEMP 'meter-out.log'
          $err = Join-Path $env:RUNNER_TEMP 'meter-err.log'
          # From the repository root, where the meter finds src/data as in development.
          $meter = Start-Process -FilePath 'src-tauri\target\release\daevalog-dps-meter.exe' `
            -WorkingDirectory $PWD -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          $null = $meter.Handle

          # The meter and the WebView2 processes it starts.
          function Family {
            $all = Get-CimInstance Win32_Process | Select-Object ProcessId, ParentProcessId
            $ids = @($meter.Id)
            do {
              $more = @($all | Where-Object { $ids -contains $_.ParentProcessId -and $ids -notcontains $_.ProcessId } | ForEach-Object { $_.ProcessId })
              $ids += $more
            } while ($more.Count -gt 0)
            $ids
          }
          function Windows { $ids = Family; @([Wins]::Visible() | Where-Object { $ids -contains $_.Pid }) }
          function Show($why) {
            Write-Host "== $why"
            foreach ($w in Windows) {
              Write-Host "window: pid $($w.Pid) class '$($w.Class)' title '$($w.Title)'"
              try {
                $names = [System.Windows.Automation.AutomationElement]::FromHandle($w.Handle).FindAll($Tree, $Any) |
                  ForEach-Object { "$($_.Current.ControlType.ProgrammaticName) '$($_.Current.Name)'" } | Select-Object -First 40
                $names | ForEach-Object { Write-Host "    $_" }
              } catch { Write-Host "    (UI Automation: $_)" }
            }
            Write-Host '-- stdout'; Get-Content $out -ErrorAction SilentlyContinue
            Write-Host '-- stderr'; Get-Content $err -ErrorAction SilentlyContinue
          }

          $deadline = (Get-Date).AddSeconds(60)
          $main = $null; $logged = $false; $notice = $null; $seen = @{}
          while ((Get-Date) -lt $deadline -and -not ($main -and $logged -and $notice)) {
            Start-Sleep -Milliseconds 500
            if ($meter.HasExited) { Show 'exited'; throw "The meter exited during start-up with code $($meter.ExitCode)" }
            if (-not $logged) { $logged = (Get-Content $out -Raw -ErrorAction SilentlyContinue) -match 'The capture library did not load' }
            foreach ($w in Windows) {
              if (-not $seen.ContainsKey($w.Handle)) {
                $seen[$w.Handle] = $true
                Write-Host "new window: pid $($w.Pid) class '$($w.Class)' title '$($w.Title)'"
              }
              if ($w.Pid -eq $meter.Id -and $w.Title -eq 'Daevalog DPS Meter') { $main = $w }
              # The notice: the page's own confirm(), so the page loaded, ran
              # and got the backend's capture-unavailable event.
              if (-not $notice) {
                try {
                  $text = [System.Windows.Automation.AutomationElement]::FromHandle($w.Handle).FindAll($Tree, $Any) |
                    Where-Object { $_.Current.Name -match 'Npcap' } | Select-Object -First 1
                  if ($text) { $notice = $w; Write-Host "notice: $($text.Current.Name)" }
                } catch {}
              }
            }
          }
          Show 'started'
          if (-not $main) { throw 'The meter window did not open within 60 s' }
          if (-not $logged) { throw 'The log does not say that capture is off' }
          if (-not $notice) { throw 'The page did not show its Npcap notice within 60 s' }
          if (-not (Test-Path $data)) { throw "No data folder at $data" }

          # Cancel the notice, then close the meter window as a player would.
          $cancel = [System.Windows.Automation.AutomationElement]::FromHandle($notice.Handle).FindAll($Tree, $Any) |
            Where-Object { $_.Current.ControlType -eq [System.Windows.Automation.ControlType]::Button -and $_.Current.Name -eq 'Cancel' } |
            Select-Object -First 1
          if (-not $cancel) { throw 'The notice has no Cancel button' }
          $cancel.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
          Start-Sleep -Seconds 1
          [void][Wins]::PostMessage($main.Handle, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero) # WM_CLOSE
          if (-not $meter.WaitForExit(20000)) {
            Show 'not closing'
            Stop-Process -Id $meter.Id -Force
            throw 'The meter did not quit within 20 s of its window closing'
          }
          Show 'closed'
          if ($meter.ExitCode -ne 0) { throw "The meter quit with code $($meter.ExitCode)" }

  platform-boundary:
    name: OS code stays in src/platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Windows and (later) Linux builds share one codebase. What keeps them from
      # getting tangled is that only src/platform/ may know which OS it is on:
      # it picks one implementation (win32/ or unsupported/, later linux/) and
      # everything else calls platform::... A cfg or a Windows API call anywhere
      # else is how the muddle starts, so it fails here. Put it behind a
      # platform:: function instead, with a twin in every OS folder.
      - name: No OS-specific code outside src/platform
        run: |
          leaks=$(grep -rnE --include='*.rs' \
            'cfg\((not\()?(windows|unix|target_os|target_family)|(^|[^_[:alnum:]])windows::|std::os::(windows|unix)' \
            src-tauri/src | grep -v '^src-tauri/src/platform/' || true)
          if [ -n "$leaks" ]; then
            echo "OS-specific code outside src-tauri/src/platform/:"
            echo "$leaks"
            exit 1
          fi

  desktop-linux:
    name: Desktop builds and tests on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      # Tauri's Linux build dependencies (WebKitGTK and friends).
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            gnome-keyring dbus-daemon
      # Builds platform/linux/ and keeps it in step with platform/win32/ (same
      # functions, same signatures).
      - name: Test
        working-directory: src-tauri
        run: cargo test --all-targets --no-default-features --features desktop
      # The capture helper and its pipe.
      - name: Test capture helper
        working-directory: src-tauri
        run: cargo test -p daevalog-capture --all-targets
      # The account token lives in the desktop keyring on Linux, and the step
      # above has none, so its tests skip there. Here they run against a real
      # GNOME Keyring in a private D-Bus session.
      - name: Keyring
        working-directory: src-tauri
        env:
          A2_REQUIRE_KEYRING: "1"
        run: |
          dbus-run-session -- sh -c '
            printf "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            cargo test --no-default-features --features desktop --lib secret -- --nocapture
          '

  parser-wasm:
    name: Parser compiles to wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      # This is not a nice-to-have. The log service re-derives an uploaded fight
      # by running this parser compiled to wasm32, rather than trusting the
      # numbers a client sent — that is what makes it safe for the client to be
      # open source. If a Tauri, pcap, HTTP or Windows dependency creeps into the
      # parser core, this job fails here instead of the divergence surfacing
      # later as a log whose numbers nobody can reproduce.
      - name: Check parser core
        working-directory: src-tauri
        run: cargo check --lib --no-default-features --target wasm32-unknown-unknown
      # The backend without Tauri, for a front end other than the Tauri one.
      # Built with none of Tauri's system libraries, so a Tauri or GTK
      # dependency creeping into it fails here.
      - name: Check backend without Tauri
        working-directory: src-tauri
        run: cargo check --no-default-features --features backend

# No `cargo fmt --check` job. The codebase predates one and is currently about
# 3,700 diff lines away from rustfmt's opinion; adding the check without doing
# the reformat would mean a permanently red build, and doing the reformat would
# bury every real change under it. Worth doing deliberately, on its own, as a
# single commit — not smuggled in beside a feature.
