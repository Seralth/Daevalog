# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "daevalog-qml"
version = "2.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "daevalog-qml"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
# The meter's backend without Tauri and WebKit.
daevalog = { package = "daevalog-dps-meter", path = "../src-tauri", default-features = false, features = ["backend"] }
dirs = "6"
parking_lot = "0.12"
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The lock hotkey, through the desktop's GlobalShortcuts portal: the same
# crates and features as the backend's.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
# The lock hotkey, through RegisterHotKey.
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# The developer build (package daevalog-dps-meter-dev): its own app id, data
# folder and capture helper name, so it runs beside an installed release.
dev = []

[build-dependencies]
cxx-qt-build = "0.10"
