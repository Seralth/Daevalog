# SPDX-License-Identifier: MIT
[package]
name = "daevalog-qml"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "daevalog-qml"
path = "src/main.rs"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }

[build-dependencies]
cxx-qt-build = "0.10"
